[project]
name = "data-pilot"
version = "0.1.0"
description = "Projeto do BootCamp Santander Dados com Python e IA - DIO"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "openai==3.49.0",
    "openrouter==1.3.160",
    "pandas==3.1.1",
    "plotly==7.1.0",
    "python-dotenv==1.2.4",
    "streamlit==1.67.0",
]

[project.scripts]
data-pilot = "data_pilot:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
